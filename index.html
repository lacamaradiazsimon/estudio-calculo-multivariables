<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{
  --bg:#0f1220; --bg2:#0b0e1a; --surf:#181c2e; --card:#1e2338; --card2:#232a42;
  --txt:#e8eaf2; --muted:#9aa3bd; --accent:#6ea8fe; --accent2:#5ce2c0; --accent3:#c9a6ff;
  --ok:#36d399; --bad:#fb7185; --warn:#fbbf24; --border:#2c3350; --shadow:rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#eef1f8; --bg2:#e3e8f4; --surf:#ffffff; --card:#ffffff; --card2:#f1f4fb;
  --txt:#1b2138; --muted:#566080; --accent:#2f6bdd; --accent2:#0ea98a; --accent3:#7c4ddb;
  --ok:#0f9d63; --bad:#d63a52; --warn:#b8780a; --border:#d4dbed; --shadow:rgba(30,40,80,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 800px at 80% -10%, rgba(110,168,254,.10), transparent 60%),
             radial-gradient(900px 700px at -10% 110%, rgba(92,226,192,.08), transparent 55%),
             var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.62; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--accent)}
/* ---------- Top bar ---------- */
#topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(160%) blur(12px); -webkit-backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--border);
}
#menuBtn{
  display:none; border:1px solid var(--border); background:var(--card);
  color:var(--txt); width:42px; height:42px; border-radius:12px; font-size:20px; cursor:pointer;
}
#brand{font-weight:700; font-size:15px; letter-spacing:.2px; display:flex; align-items:center; gap:8px}
#brand .dot{color:var(--accent2)}
#brand small{color:var(--muted); font-weight:500}
#topRight{margin-left:auto; display:flex; align-items:center; gap:10px}
#themeBtn{border:1px solid var(--border); background:var(--card); color:var(--txt); width:42px;height:42px;border-radius:12px;font-size:18px;cursor:pointer}
#progWrap{display:flex;align-items:center;gap:8px;min-width:90px}
#progBar{flex:1;height:8px;background:var(--card2);border-radius:99px;overflow:hidden;min-width:60px}
#progFill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
#progTxt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* ---------- Layout ---------- */
#layout{display:flex; max-width:1180px; margin:0 auto; gap:0}
#sidebar{
  width:286px; flex:none; padding:18px 14px 60px; position:sticky; top:64px; align-self:flex-start;
  max-height:calc(100vh - 64px); overflow-y:auto;
}
#sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin:6px 8px 10px}
.navItem{
  display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:13px; cursor:pointer;
  color:var(--txt); border:1px solid transparent; margin-bottom:4px; transition:background .15s,border .15s;
}
.navItem:hover{background:var(--card)}
.navItem.active{background:var(--card); border-color:var(--border)}
.navItem .ic{font-size:20px; width:26px; text-align:center; flex:none}
.navItem .nm{font-size:14px; font-weight:600; line-height:1.25}
.navItem .nm small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;margin-top:1px}
.navItem .chk{margin-left:auto; color:var(--ok); font-size:15px; opacity:0; flex:none}
.navItem.done .chk{opacity:1}
.navItem.done .ic{opacity:.65}
#scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:35}
/* ---------- Content ---------- */
#main{flex:1; min-width:0; padding:22px 20px 120px}
.mhead{margin:4px 0 20px}
.mhead .kick{color:var(--accent2);font-weight:700;font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase}
.mhead h1{font-size:27px;line-height:1.2;margin:6px 0 4px}
.mhead h1 .e{margin-right:8px}
.mhead p{color:var(--muted);margin:0;font-size:16px}
.section{margin:30px 0}
.section > .stitle{
  display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--muted);margin:0 0 14px;
}
.section > .stitle::after{content:"";flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 18px;box-shadow:0 8px 30px -18px var(--shadow);margin-bottom:14px}
.para{margin:0 0 14px}
.para:last-child{margin-bottom:0}
.formula{
  background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:14px 0;
  overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; text-align:center;
}
.formula .cap{display:block;color:var(--muted);font-size:13px;margin-top:6px;text-align:center}
.callout{
  border-left:4px solid var(--accent); background:linear-gradient(90deg, color-mix(in srgb,var(--accent) 12%, transparent), transparent 70%);
  border-radius:10px;padding:12px 14px;margin:14px 0;
}
.callout::before{content:"💡 ";}
strong{color:var(--txt);font-weight:700}
code{background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:.92em}
/* ---------- Interactive bits ---------- */
.btn{
  appearance:none;border:1px solid var(--border);background:var(--card2);color:var(--txt);
  border-radius:12px;padding:11px 15px;font-size:14.5px;font-weight:600;cursor:pointer;
  min-height:44px; transition:background .15s,transform .05s; touch-action:manipulation;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--accent),#5b93ee);border-color:transparent;color:#08101f}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:13px;min-height:38px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* steps (guided derivation + exercise) */
.step{border:1px solid var(--border);border-radius:15px;padding:14px 15px;margin-bottom:12px;background:var(--card)}
.step .qn{display:flex;gap:10px;align-items:flex-start}
.step .badge{flex:none;width:27px;height:27px;border-radius:8px;background:var(--card2);border:1px solid var(--border);
  display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--accent2)}
.step .prompt{font-weight:600;margin:0}
.hintbox{margin-top:11px}
.hint{background:var(--card2);border:1px dashed var(--border);border-radius:10px;padding:9px 12px;margin-top:8px;font-size:15px;color:var(--txt)}
.hint .lab{color:var(--warn);font-weight:700;font-size:12px;letter-spacing:.5px;display:block;margin-bottom:2px}
.reveal{margin-top:11px;border-top:1px dashed var(--border);padding-top:11px;display:none}
.reveal.show{display:block;animation:fade .3s}
.reveal .ans{background:color-mix(in srgb,var(--ok) 12%, transparent);border:1px solid color-mix(in srgb,var(--ok) 35%, var(--border));border-radius:11px;padding:10px 12px;margin-bottom:8px}
.reveal .exp{color:var(--muted);font-size:15px}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.finalans{margin-top:6px;background:color-mix(in srgb,var(--accent2) 12%, transparent);border:1px solid color-mix(in srgb,var(--accent2) 34%, var(--border));border-radius:12px;padding:11px 14px}
.finalans .lab{color:var(--accent2);font-weight:700;font-size:12px;letter-spacing:.6px;display:block;margin-bottom:3px}
/* quiz */
.quiz{border:1px solid var(--border);border-radius:15px;padding:15px;margin-bottom:13px;background:var(--card)}
.quiz .q{font-weight:600;margin:0 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:9px;cursor:pointer;background:var(--card2);transition:border .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt .mk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.opt.correct .mk{border-color:var(--ok);background:var(--ok);color:#04130c}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt.wrong .mk{border-color:var(--bad);background:var(--bad);color:#1a0408}
.opt.locked{cursor:default;opacity:.85}
.opt.locked:hover{border-color:var(--border)}
.opt.correct.locked,.opt.wrong.locked{opacity:1}
.fb{font-size:14px;color:var(--muted);margin:2px 0 0;display:none}
.opt.show-fb .fb{display:block}
.qexp{margin-top:6px;background:var(--card2);border-radius:11px;padding:11px 13px;font-size:15px;display:none}
.qexp.show{display:block}
.qexp .lab{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.5px;display:block;margin-bottom:3px}
/* takeaways */
.takeaways{list-style:none;padding:0;margin:0}
.takeaways li{position:relative;padding:9px 12px 9px 38px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:9px}
.takeaways li::before{content:"⭐";position:absolute;left:12px;top:9px}
/* widget shell */
.widget{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin:6px 0 4px;overflow:hidden}
.widget .whead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin:0 2px 10px}
.widget .whead .tag{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.wcanvas{display:block;width:100%;border-radius:13px;background:var(--bg2);border:1px solid var(--border);touch-action:none}
.wctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:11px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--card2)}
.seg button{border:none;background:transparent;color:var(--muted);padding:9px 13px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:40px}
.seg button.on{background:var(--accent);color:#08101f}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.field input[type=range]{accent-color:var(--accent);height:30px}
.readout{font-variant-numeric:tabular-nums;background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:9px 12px;font-size:14px;line-height:1.45}
.readout b{color:var(--accent2)}
.readout .big{font-size:20px;font-weight:800;color:var(--txt)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--card2);border:1px solid var(--border);border-radius:99px;padding:5px 10px}
/* footer nav */
.fnav{display:flex;gap:10px;margin-top:34px;padding-top:18px;border-top:1px solid var(--border)}
.fnav .btn{flex:1;justify-content:center;display:flex;align-items:center;gap:7px}
.markdone{width:100%;margin-top:14px}
.bignote{color:var(--muted);font-size:13.5px;text-align:center;margin-top:26px}
.bignote a{cursor:pointer}
@media (max-width:860px){
  body{font-size:16px}
  #menuBtn{display:block}
  #sidebar{
    position:fixed; top:0; left:0; bottom:0; width:300px; max-width:86vw; z-index:36;
    background:var(--surf); transform:translateX(-104%); transition:transform .26s ease;
    padding-top:calc(18px + env(safe-area-inset-top)); max-height:none; box-shadow:0 0 40px var(--shadow);
  }
  #sidebar.open{transform:none}
  #scrim.open{display:block}
  #main{padding:18px 15px 120px}
  .mhead h1{font-size:23px}
  #brand small{display:none}
  #progWrap{min-width:64px}
}
@media (max-width:420px){
  .mhead h1{font-size:21px}
  .card,.widget{border-radius:15px}
}
</style>
</head>
<body>
<div id="topbar">
  <button id="menuBtn" aria-label="Menú">☰</button>
  <div id="brand">📘 <span>Cálculo Multivariables</span> <small>Examen final</small></div>
  <div id="topRight">
    <div id="progWrap" title="Progreso">
      <div id="progBar"><div id="progFill"></div></div>
      <span id="progTxt">0%</span>
    </div>
    <button id="themeBtn" aria-label="Tema">🌙</button>
  </div>
</div>
<div id="scrim"></div>
<div id="layout">
  <aside id="sidebar">
    <h3>Módulos</h3>
    <div id="navList"></div>
    <div class="bignote">Toca un módulo para empezar.<br>Tu progreso se guarda en este dispositivo.</div>
  </aside>
  <main id="main">
    <div id="content"><!-- render --></div>
  </main>
</div>

<script id="data">window.MODULES_DATA = [
{
  id: "apuntes", icon: "🎯", title: "Apuntes", widget: "none",
  subtitle: "Todas las fórmulas del semestre en una pantalla",
  theory: [
    { type: "para", content: "**1 · Límites y continuidad (Clases 1–6)**" },
    { type: "para", content: "**No existe** si dos trayectorias dan límites distintos (unicidad). En polares \\(x=a+r\\cos\\theta,\\ y=b+r\\operatorname{sen}\\theta\\): si el resultado **depende de \\(\\theta\\)**, no existe; si \\(f=H(r)\\,G(\\theta)\\) con \\(H(r)\\to 0\\) y \\(G\\) **acotada**, el límite es \\(0\\). También sirve **acotamiento** (sandwich)." },
    { type: "para", content: "**Continuidad en \\(\\vec x_0\\):** \\(\\lim_{\\vec x\\to\\vec x_0} f(\\vec x)=f(\\vec x_0)\\). Álgebra de continuas: suma, producto, cociente (denominador \\(\\neq 0\\)) y composición." },
    { type: "para", content: "**2 · Diferenciabilidad y plano tangente (Clases 7–11)**" },
    { type: "formula", content: "z=f(a,b)+\\frac{\\partial f}{\\partial x}(a,b)(x-a)+\\frac{\\partial f}{\\partial y}(a,b)(y-b)", caption: "Plano tangente a \\(z=f(x,y)\\) en \\((a,b)\\); el lado derecho es la aproximación lineal \\(L(x,y)\\)." },
    { type: "para", content: "**Cadena de implicaciones:** parciales continuas en una vecindad \\(\\Rightarrow\\) diferenciable \\(\\Rightarrow\\) continua (y existen las parciales). Los recíprocos son **falsos**." },
    { type: "formula", content: "\\frac{\\partial f}{\\partial x}=\\frac{\\partial f}{\\partial u}\\frac{\\partial u}{\\partial x}+\\frac{\\partial f}{\\partial v}\\frac{\\partial v}{\\partial x}", caption: "Regla de la cadena, \\(f=f(u,v)\\), \\(u=u(x,y)\\), \\(v=v(x,y)\\) (análoga en \\(y\\))." },
    { type: "formula", content: "D_{\\vec u}f(\\vec a)=\\nabla f(\\vec a)\\cdot\\vec u,\\qquad \\max_{\\vec u}\\,D_{\\vec u}f(\\vec a)=\\lVert\\nabla f(\\vec a)\\rVert", caption: "\\(\\vec u\\) **SIEMPRE unitario**. Máximo en la dirección de \\(\\nabla f\\); mínimo \\(-\\lVert\\nabla f\\rVert\\) en \\(-\\nabla f\\)." },
    { type: "formula", content: "\\Pi:\\ \\nabla F(a,b,c)\\cdot(x-a,\\ y-b,\\ z-c)=0,\\qquad f_x=-\\frac{F_x}{F_z}", caption: "Superficie de nivel \\(F=0\\): \\(\\nabla F\\) es normal. Función implícita \\(z=f(x,y)\\): requiere \\(F_z\\neq 0\\)." },
    { type: "para", content: "**3 · Optimización (Clases 12–13)**" },
    { type: "formula", content: "D=f_{xx}f_{yy}-f_{xy}^2:\\quad D\\gt 0,\\ f_{xx}\\gt 0\\Rightarrow\\text{mín};\\quad D\\gt 0,\\ f_{xx}\\lt 0\\Rightarrow\\text{máx};\\quad D\\lt 0\\Rightarrow\\text{silla}", caption: "Criterio del Hessiano en el punto crítico (\\(\\nabla f=\\vec 0\\)). En \\(n\\) variables: subdeterminantes principales." },
    { type: "formula", content: "\\nabla f(\\vec x_0)=\\lambda\\,\\nabla g(\\vec x_0),\\qquad g(\\vec x_0)=0", caption: "Multiplicadores de Lagrange (\\(f,g\\) de clase \\(\\mathcal{C}^1\\), \\(\\nabla g\\neq\\vec 0\\)). El sistema casi siempre **bifurca en casos**." },
    { type: "callout", content: "**Weierstrass:** \\(f\\) continua sobre \\(D\\) **cerrado y acotado** alcanza máximo y mínimo absolutos. Cítalo SIEMPRE para justificar que los extremos existen. Sobre un compacto: candidatos = críticos del interior + análisis de la frontera (+ vértices)." },
    { type: "para", content: "**4 · Integrales dobles (Clases 14–16)**" },
    { type: "formula", content: "\\iint_D f\\,dA=\\int_a^b\\!\\!\\int_{g_1(x)}^{g_2(x)} f\\,dy\\,dx \\ \\ (\\text{tipo I});\\qquad \\int_c^d\\!\\!\\int_{h_1(y)}^{h_2(y)} f\\,dx\\,dy \\ \\ (\\text{tipo II})", caption: "Fubini: sobre un rectángulo el orden da igual. Para cambiar el orden: **redibuja la región**." },
    { type: "formula", content: "\\iint_D f\\,dA=\\iint_{D^*} f\\,\\left|\\frac{\\partial(x,y)}{\\partial(u,v)}\\right|\\,du\\,dv,\\qquad \\frac{\\partial(x,y)}{\\partial(u,v)}=\\frac{1}{\\ \\partial(u,v)/\\partial(x,y)\\ }", caption: "Cambio de variables (\\(T\\in\\mathcal{C}^1\\), inyectiva). El truco del recíproco evita despejar \\(x,y\\)." },
    { type: "formula", content: "dA=r\\,dr\\,d\\theta", caption: "Polares: \\(x=r\\cos\\theta,\\ y=r\\operatorname{sen}\\theta\\); jacobiano \\(=r\\). ¡No lo olvides!" },
    { type: "para", content: "**5 · Integrales triples (Clases 17–19)**" },
    { type: "formula", content: "\\text{Cilíndricas: } dV=r\\,dz\\,dr\\,d\\theta\\qquad\\qquad \\text{Volumen}(D)=\\iiint_D 1\\,dV" },
    { type: "formula", content: "x=\\rho\\cos\\theta\\operatorname{sen}\\varphi,\\quad y=\\rho\\operatorname{sen}\\theta\\operatorname{sen}\\varphi,\\quad z=\\rho\\cos\\varphi,\\qquad dV=\\rho^2\\operatorname{sen}\\varphi\\;d\\rho\\,d\\varphi\\,d\\theta", caption: "Esféricas (convención del curso): \\(\\theta\\) azimutal como en cilíndricas (\\(0\\le\\theta\\lt 2\\pi\\)), \\(\\varphi\\) desde el eje \\(z\\) (\\(0\\le\\varphi\\le\\pi\\))." },
    { type: "callout", content: "Clásicos del examen: esfera \\(x^2+y^2+z^2=4z\\ \\Rightarrow\\ \\rho=4\\cos\\varphi\\); cono \\(z=\\sqrt{x^2+y^2}\\ \\Rightarrow\\ \\varphi=\\pi/4\\); esfera \\(x^2+y^2+z^2=a^2\\Rightarrow\\rho=a\\). Simetría axial → cilíndricas; simetría esférica/conos → esféricas." },
    { type: "para", content: "**6 · Curvas y campos (Clases 20–22)**" },
    { type: "formula", content: "\\int_\\gamma f\\,ds=\\int_a^b f(\\vec r(t))\\,\\lVert\\vec r\\,'(t)\\rVert\\,dt,\\qquad l(\\gamma)=\\int_a^b\\lVert\\vec r\\,'(t)\\rVert\\,dt", caption: "Integral de trayectoria (campo escalar): masa de un alambre si \\(f=\\delta\\). No depende de la orientación." },
    { type: "formula", content: "\\int_\\gamma \\vec F\\cdot d\\vec r=\\int_a^b \\vec F(\\vec r(t))\\cdot\\vec r\\,'(t)\\,dt=\\int_\\gamma P\\,dx+Q\\,dy+R\\,dz", caption: "Integral de línea (trabajo). Cambia de **signo** al invertir la orientación." },
    { type: "formula", content: "\\vec F=\\nabla f\\ \\Longrightarrow\\ \\int_\\gamma\\vec F\\cdot d\\vec r=f(B)-f(A)", caption: "Teorema Fundamental (TFIL). Conservativo en 2D: \\(P_y=Q_x\\) en región **simplemente conexa**; en \\(\\mathbb{R}^3\\): \\(\\operatorname{rot}\\vec F=\\vec 0\\)." },
    { type: "para", content: "**7 · Green, Stokes y Gauss (Clases 22–23)**" },
    { type: "formula", content: "\\oint_{\\gamma^+} P\\,dx+Q\\,dy=\\iint_D\\left(\\frac{\\partial Q}{\\partial x}-\\frac{\\partial P}{\\partial y}\\right)dA", caption: "Green: \\(\\gamma\\) cerrada, simple, suave a trozos, orientación **antihoraria**; \\(P,Q\\) con parciales continuas en un abierto que contiene a \\(D\\)." },

        { text: "\\(36\\pi\\)", correct: false, feedback: "Revisa la intersección: \\(6-r^2=r\\) factoriza \\((r+3)(r-2)=0\\), o sea \\(r=2\\) (no 3), y el integrando es \\(r(6-r^2-r)\\)." }

        { text: "\\(8\\pi\\)", correct: false, feedback: "La altura es \\(3-(-1)=4\\), no 2: \\(A=2\\pi\\cdot 2\\cdot 4=16\\pi\\)." },
        { text: "\\(4\\pi\\cdot 4=16\\pi^2\\)", correct: false, feedback: "Cuidado con los \\(\\pi\\): perímetro \\(2\\pi r=4\\pi\\) por altura 4 da \\(16\\pi\\), no \\(16\\pi^2\\)." }

<script>
"use strict";
/* ============================================================ helpers */
const $ = (s,r)=> (r||document).querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
function escapeHTML(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(s){ // tiny markdown-lite over already math-delimited text
  let h = escapeHTML(s);
  h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/`([^`]+?)`/g,'<code>$1</code>');
  return h;
}
function typeset(node){
  if(window.MathJax && MathJax.typesetPromise){
    try{ if(MathJax.typesetClear) MathJax.typesetClear([node]); }catch(e){}
    return MathJax.typesetPromise([node]).catch(()=>{});
  }
  return Promise.resolve();
}
function dispLatex(latex){ // display formula node
  const d = el('div','formula');
  const span = el('span'); span.textContent = '\\[' + (latex||'') + '\\]';
  d.appendChild(span);
  return d;
}

/* ============================================================ state */
const MODULES = (window.MODULES_DATA && window.MODULES_DATA.length) ? window.MODULES_DATA : [];
const APP_ID='multiexam';
const LS_PROG='estudio_'+APP_ID+'_prog', LS_THEME='estudio_'+APP_ID+'_theme', LS_LAST='estudio_'+APP_ID+'_last';
let progress = new Set();
try{ progress = new Set(JSON.parse(localStorage.getItem(LS_PROG)||'[]')); }catch(e){}
let current = 0;
try{ const l=parseInt(localStorage.getItem(LS_LAST)); if(!isNaN(l)) current=l; }catch(e){}
function saveProg(){ try{localStorage.setItem(LS_PROG, JSON.stringify([...progress]));}catch(e){} }

const contentEl = $('#content'), navList = $('#navList');
window.__retypeset = ()=> typeset(contentEl);

/* ============================================================ nav */
function renderNav(){
  navList.innerHTML='';
  MODULES.forEach((m,i)=>{
    const it = el('div','navItem'+(i===current?' active':'')+(progress.has(m.id)?' done':''));
    it.innerHTML = `<span class="ic">${m.icon||'•'}</span><span class="nm">${escapeHTML(m.title)}<small>${escapeHTML(m.subtitle||'')}</small></span><span class="chk">✓</span>`;
    it.onclick=()=>{ go(i); closeDrawer(); };
    navList.appendChild(it);
  });
  const pct = MODULES.length? Math.round(100*progress.size/MODULES.length):0;
  $('#progFill').style.width=pct+'%'; $('#progTxt').textContent=pct+'%';
}

/* ============================================================ render module */
function go(i){ current=Math.max(0,Math.min(MODULES.length-1,i)); try{localStorage.setItem(LS_LAST,current);}catch(e){} renderModule(); renderNav(); window.scrollTo({top:0,behavior:'smooth'}); }

function sectionWrap(titleHTML){
  const s=el('section','section'); const t=el('div','stitle'); t.innerHTML=titleHTML; s.appendChild(t); return s;
}

function renderModule(){
  const m=MODULES[current]; if(!m){ contentEl.innerHTML='<p style="color:var(--muted)">Cargando contenido…</p>'; return; }
  contentEl.innerHTML='';
  // head
  const head=el('div','mhead');
  head.innerHTML=`<div class="kick">Módulo ${current+1} de ${MODULES.length}</div>
    <h1><span class="e">${m.icon||''}</span>${escapeHTML(m.title)}</h1><p>${escapeHTML(m.subtitle||'')}</p>`;
  contentEl.appendChild(head);

  // theory
  if(m.theory && m.theory.length){
    const s=sectionWrap('📖 Teoría'); const card=el('div','card');
    m.theory.forEach(b=>{
      if(b.type==='formula'){ card.appendChild(dispLatex(b.content)); if(b.caption){const c=el('span','cap');c.innerHTML=md(b.caption);card.lastChild.appendChild(c);} }
      else if(b.type==='callout'){ const c=el('div','callout'); c.innerHTML=md(b.content); card.appendChild(c); }
      else { const p=el('div','para'); p.innerHTML=md(b.content); card.appendChild(p); }
    });
    s.appendChild(card); contentEl.appendChild(s);
  }

  // widget
  if(m.widget && m.widget!=='none' && WIDGETS[m.widget]){
    const s=sectionWrap('🧪 Explora'); const w=el('div','widget');
    s.appendChild(w); contentEl.appendChild(s);
    try{ WIDGETS[m.widget](w); }catch(e){ w.innerHTML='<p style="color:var(--muted)">Widget no disponible.</p>'; console.error(e); }
  }

  // guided derivation
  if(m.guidedDerivation){
    const gd=m.guidedDerivation;
    const s=sectionWrap('✍️ '+escapeHTML(gd.title||'Deducción guiada'));
    if(gd.intro){ const p=el('div','card'); p.innerHTML=md(gd.intro); s.appendChild(p); }
    (gd.steps||[]).forEach((st,idx)=> s.appendChild(stepCard(st,idx,'deriv')) );
    contentEl.appendChild(s);
  }

  // exercises
  if(m.exercises && m.exercises.length){
    const s=sectionWrap('📝 Ejercicios paso a paso');
    m.exercises.forEach((ex,ei)=>{
      const card=el('div','card');
      const stm=el('div','para'); stm.innerHTML='<strong>Ejercicio '+(ei+1)+'.</strong> '+md(ex.statement); card.appendChild(stm);
      (ex.steps||[]).forEach((st,si)=> card.appendChild(stepCard(st,si,'ex')) );
      if(ex.finalAnswerLatex){
        const fa=el('div','finalans'); fa.innerHTML='<span class="lab">✅ Resultado</span>';
        fa.appendChild(dispLatex(ex.finalAnswerLatex)); card.appendChild(fa);
      }
      s.appendChild(card);
    });
    contentEl.appendChild(s);
  }

  // conceptual
  if(m.conceptual && m.conceptual.length){
    const s=sectionWrap('🧠 Preguntas conceptuales');
    m.conceptual.forEach((q,qi)=> s.appendChild(quizCard(q,qi)) );
    contentEl.appendChild(s);
  }

  // takeaways
  if(m.keyTakeaways && m.keyTakeaways.length){
    const s=sectionWrap('⭐ Ideas clave'); const ul=el('ul','takeaways');
    m.keyTakeaways.forEach(t=>{ const li=el('li'); li.innerHTML=md(t); ul.appendChild(li); });
    s.appendChild(ul); contentEl.appendChild(s);
  }

  // mark done + footer nav
  const done=progress.has(m.id);
  const mk=el('button','btn primary markdone', done?'✓ Repasado — ¡bien!':'Marcar este módulo como repasado');
  mk.onclick=()=>{ if(progress.has(m.id))progress.delete(m.id); else progress.add(m.id); saveProg(); renderNav(); renderModule(); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); };
  contentEl.appendChild(mk);

  const fn=el('div','fnav');
  const prev=el('button','btn ghost','← Anterior'); prev.disabled=current===0; prev.onclick=()=>go(current-1);
  const next=el('button','btn','Siguiente →'); next.disabled=current===MODULES.length-1; next.onclick=()=>go(current+1);
  fn.appendChild(prev); fn.appendChild(next); contentEl.appendChild(fn);

  typeset(contentEl);
}

/* ---- step card (guided + exercise) with progressive hints + reveal ---- */
function stepCard(st,idx,kind){
  const c=el('div','step');
  const qn=el('div','qn');
  qn.appendChild(el('div','badge', String(idx+1)));
  const pr=el('div'); pr.className='prompt'; pr.innerHTML=md(st.prompt); qn.appendChild(pr);
  c.appendChild(qn);

  const hints=st.hints||[]; let shown=0;
  const hb=el('div','hintbox');
  const ctrls=el('div','row'); ctrls.style.marginTop='10px';
  const hintBtn=el('button','btn sm ghost', hints.length?'💡 Pista':'');
  const revBtn=el('button','btn sm', kind==='ex'?'Ver solución del paso':'Ver paso');
  if(hints.length) ctrls.appendChild(hintBtn); ctrls.appendChild(revBtn);
  c.appendChild(ctrls); c.appendChild(hb);

  hintBtn.onclick=()=>{
    if(shown>=hints.length) return;
    const h=el('div','hint'); h.innerHTML='<span class="lab">Pista '+(shown+1)+'</span>'+md(hints[shown]); hb.appendChild(h); typeset(h);
    shown++;
    if(shown>=hints.length){ hintBtn.textContent='No hay más pistas'; hintBtn.disabled=true; }
  };

  const rev=el('div','reveal');
  const ans=el('div','ans'); ans.appendChild(dispLatex(st.revealLatex!=null?st.revealLatex:st.answerLatex||''));
  rev.appendChild(ans);
  if(st.explanation){ const ex=el('div','exp'); ex.innerHTML=md(st.explanation); rev.appendChild(ex); }
  c.appendChild(rev);
  revBtn.onclick=()=>{ const open=rev.classList.toggle('show'); revBtn.textContent= open?'Ocultar':(kind==='ex'?'Ver solución del paso':'Ver paso'); if(open) typeset(rev); };
  return c;
}

/* ---- quiz card ---- */
function quizCard(q,qi){
  const c=el('div','quiz');
  const qq=el('div','q'); qq.innerHTML='<strong>'+(qi+1)+'.</strong> '+md(q.question); c.appendChild(qq);
  const exp=el('div','qexp'); exp.innerHTML='<span class="lab">Explicación</span>'+md(q.explanation||'');
  let answered=false;
  (q.options||[]).forEach(o=>{
    const op=el('div','opt');
    op.innerHTML='<span class="mk"></span><div><div class="otext"></div><div class="fb"></div></div>';
    $('.otext',op).innerHTML=md(o.text); $('.fb',op).innerHTML=md(o.feedback||'');
    op.onclick=()=>{
      if(answered && o.correct===false) { return; }
      // allow exploring: lock only the act of marking; we lock after first pick
      if(answered) return;
      answered=true;
      [...c.querySelectorAll('.opt')].forEach(x=>x.classList.add('locked'));
      // mark all correct ones
      (q.options||[]).forEach((oo,k)=>{ const node=c.querySelectorAll('.opt')[k];
        if(oo.correct){ node.classList.add('correct'); node.querySelector('.mk').textContent='✓'; }
      });
      if(!o.correct){ op.classList.add('wrong'); op.querySelector('.mk').textContent='✕'; }
      op.classList.add('show-fb');
      // also show feedback of the correct one
      (q.options||[]).forEach((oo,k)=>{ if(oo.correct){ c.querySelectorAll('.opt')[k].classList.add('show-fb'); }});
      exp.classList.add('show'); typeset(c);
    };
    c.appendChild(op);
  });
  c.appendChild(exp);
  return c;
}

/* ============================================================ canvas util */
function setupCanvas(host,height){
  const cv=el('canvas','wcanvas'); cv.style.height=height+'px'; host.appendChild(cv);
  const ctx=cv.getContext('2d');
  function size(){ const dpr=window.devicePixelRatio||1; const w=cv.clientWidth||300, h=cv.clientHeight||height;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); return {w,h,ctx}; }
  return {cv,ctx,size};
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888'; }
function whead(host,title,tag){ const h=el('div','whead'); h.innerHTML=`<span>${title}</span>`+(tag?`<span class="tag">${tag}</span>`:''); host.appendChild(h); }
function ctrlRow(host){ const r=el('div','wctrls'); host.appendChild(r); return r; }
function rangeField(label, min,max,val,step,oninput){
  const f=el('label','field'); const sp=el('span'); sp.textContent=label;
  const inp=el('input'); inp.type='range'; inp.min=min;inp.max=max;inp.value=val;inp.step=step;
  const out=el('b'); out.textContent=(+val).toFixed(step<1?2:0);
  inp.oninput=()=>{ out.textContent=(+inp.value).toFixed(step<1?2:0); oninput(+inp.value); };
  f.appendChild(sp); f.appendChild(inp); f.appendChild(out); return {f,inp,out};
}
function segmented(host,opts,initial,onpick){
  const s=el('div','seg'); opts.forEach((o,i)=>{ const b=el('button',i===initial?'on':'',o.label);
    b.onclick=()=>{ [...s.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); onpick(o.value,i); };
    s.appendChild(b); }); host.appendChild(s); return s;
}

/* ============================================================ WIDGETS */
const WIDGETS={};

/* --- Módulo límites: el valor de f según la trayectoria de acercamiento --- */
WIDGETS['limite-trayectorias']=function(host){
  whead(host,'Límite según la trayectoria','(x,y) → (0,0)');
  const {cv,ctx,size}=setupCanvas(host,300);
  const readout=el('div','readout'); host.appendChild(readout);
  const ctr=ctrlRow(host);
  let fun='A', deg=30;
  segmented(ctr,[{label:'xy/(x²+y²)',value:'A'},{label:'x²y²/(x²+y²)',value:'B'}],0,(v)=>{fun=v;draw();});
  ctr.appendChild(rangeField('θ (°)',0,180,30,1,v=>{deg=v;draw();}).f);
  function g(t,th){ const c=Math.cos(th), s=Math.sin(th);
    if(fun==='A') return c*s;
    return t*t*c*c*s*s;
  }
  function draw(){
    const {w,h}=size(); ctx.clearRect(0,0,w,h);
    const th=deg*Math.PI/180;
    // panel izquierdo: el plano con el rayo de acercamiento
    const ps=Math.min(h-24, Math.max(110,w*0.34)), px=10, py=(h-ps)/2;
    const cx=px+ps/2, cy=py+ps/2;
    ctx.strokeStyle=cssVar('--border'); ctx.lineWidth=1;
    ctx.strokeRect(px,py,ps,ps);
    ctx.beginPath(); ctx.moveTo(px,cy); ctx.lineTo(px+ps,cy); ctx.moveTo(cx,py); ctx.lineTo(cx,py+ps); ctx.stroke();
    ctx.strokeStyle=cssVar('--accent'); ctx.lineWidth=2.4;
    const rx=Math.cos(th)*ps*0.44, ry=Math.sin(th)*ps*0.44;
    ctx.beginPath(); ctx.moveTo(cx+rx,cy-ry); ctx.lineTo(cx,cy); ctx.stroke();
    ctx.fillStyle=cssVar('--bad'); ctx.beginPath(); ctx.arc(cx,cy,4,0,7); ctx.fill();
    // panel derecho: g(t)=f(t cosθ, t senθ) para t∈(0,1]
    const gx=px+ps+26, gw=Math.max(60,w-gx-14), gy=py, gh=ps;
    const vmax=0.6;
    const X=t=> gx+t*gw, Y=v=> gy+gh/2-(v/vmax)*(gh/2);
    ctx.strokeStyle=cssVar('--border'); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(gx,Y(0)); ctx.lineTo(gx+gw,Y(0)); ctx.moveTo(gx,gy); ctx.lineTo(gx,gy+gh); ctx.stroke();
    const L=(fun==='A')? Math.cos(th)*Math.sin(th) : 0;
    ctx.strokeStyle=cssVar('--warn'); ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(gx,Y(L)); ctx.lineTo(gx+gw,Y(L)); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle=cssVar('--accent2'); ctx.lineWidth=2.4; ctx.beginPath();
    for(let i=1;i<=120;i++){ const t=i/120; const v=g(t,th); (i===1?ctx.moveTo:ctx.lineTo).call(ctx,X(t),Y(v)); }
    ctx.stroke();
    // etiquetas
    ctx.fillStyle=cssVar('--muted'); ctx.font='11px sans-serif';
    ctx.fillText('plano xy', px+4, py+14);
    ctx.fillText('f a lo largo del rayo (t → 0 es acercarse)', gx+4, gy+14);
    const Ltxt=L.toFixed(3);
    readout.innerHTML=(fun==='A')
      ? 'Rayo de ángulo \\(\\theta='+deg+'^\\circ\\): el valor es constante \\(=\\cos\\theta\\,\\operatorname{sen}\\theta='+Ltxt+'\\). Mueve \\(\\theta\\): el valor <b>cambia con la dirección ⇒ el límite NO existe</b>.'
      : 'Rayo de ángulo \\(\\theta='+deg+'^\\circ\\): \\(f=t^2\\cos^2\\theta\\,\\operatorname{sen}^2\\theta\\to 0\\) para <b>todo</b> \\(\\theta\\). Criterio polar: \\(H(r)=r^2\\to 0\\), \\(G(\\theta)\\) acotada ⇒ <b>el límite ES 0</b>.';
    typeset(readout);
  }
  requestAnimationFrame(draw); window.addEventListener('resize',()=>requestAnimationFrame(draw));
};

/* --- Módulo gradiente: derivada direccional sobre curvas de nivel --- */
WIDGETS['gradiente-direccional']=function(host){
  whead(host,'Derivada direccional en vivo','f(x,y)=x²+2y² en a=(1,1)');
  const {cv,ctx,size}=setupCanvas(host,320);
  const readout=el('div','readout'); host.appendChild(readout);
  const ctr=ctrlRow(host);
  let deg=63;
  ctr.appendChild(rangeField('α (°)',0,360,63,1,v=>{deg=v;draw();}).f);
  const GX=2, GY=4, NG=Math.sqrt(20);
  function draw(){
    const {w,h}=size(); ctx.clearRect(0,0,w,h);
    const s=Math.min(w/7.2,h/5.4);
    const cx=w/2-1*s, cy=h/2+1*s;
    const X=x=>cx+x*s, Y=y=>cy-y*s;
    function arrow(x0,y0,x1,y1,color,lw){
      ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw;
      ctx.beginPath(); ctx.moveTo(X(x0),Y(y0)); ctx.lineTo(X(x1),Y(y1)); ctx.stroke();
      const ang=Math.atan2(Y(y1)-Y(y0), X(x1)-X(x0));
      ctx.beginPath(); ctx.moveTo(X(x1),Y(y1));
      ctx.lineTo(X(x1)-10*Math.cos(ang-0.42), Y(y1)-10*Math.sin(ang-0.42));
      ctx.lineTo(X(x1)-10*Math.cos(ang+0.42), Y(y1)-10*Math.sin(ang+0.42));
      ctx.closePath(); ctx.fill();
    }
    // ejes
    ctx.strokeStyle=cssVar('--border'); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(-3),Y(0)); ctx.lineTo(X(4.2),Y(0)); ctx.moveTo(X(0),Y(-2)); ctx.lineTo(X(0),Y(3.4)); ctx.stroke();
    // curvas de nivel x²+2y²=c
    [0.75,1.5,3,5,7.5].forEach(c=>{
      const on = Math.abs(c-3)<0.01;
      ctx.strokeStyle= on? cssVar('--accent3') : cssVar('--muted');
      ctx.globalAlpha= on? 0.95:0.35; ctx.lineWidth= on?1.8:1;
      ctx.beginPath();
      for(let i=0;i<=100;i++){ const t=i/100*2*Math.PI;
        const ex=Math.sqrt(c)*Math.cos(t), ey=Math.sqrt(c/2)*Math.sin(t);
        (i?ctx.lineTo:ctx.moveTo).call(ctx,X(ex),Y(ey)); }
      ctx.stroke();
    });
    ctx.globalAlpha=1;
    // vectores desde a=(1,1)
    const gl=1.5, gux=GX/NG, guy=GY/NG;
    arrow(1,1,1+gux*gl,1+guy*gl,cssVar('--accent2'),2.6);
    const a=deg*Math.PI/180, ux=Math.cos(a), uy=Math.sin(a);
    arrow(1,1,1+ux*1.05,1+uy*1.05,cssVar('--accent'),2.6);
    ctx.fillStyle=cssVar('--txt'); ctx.beginPath(); ctx.arc(X(1),Y(1),4.5,0,7); ctx.fill();
    ctx.fillStyle=cssVar('--accent2'); ctx.font='12px sans-serif';
    ctx.fillText('∇f', X(1+gux*gl)+6, Y(1+guy*gl));
    ctx.fillStyle=cssVar('--accent');
    ctx.fillText('u', X(1+ux*1.05)+6, Y(1+uy*1.05)+4);
    const D=GX*ux+GY*uy;
    const estado = D>0.05? 'f SUBE en esa dirección' : (D<-0.05? 'f BAJA en esa dirección' : 'tangente al nivel: f no cambia');
    readout.innerHTML='\\(\\nabla f(1,1)=(2,4)\\), \\(\\lVert\\nabla f\\rVert=\\sqrt{20}\\approx 4.47\\). Con \\(\\alpha='+deg+'^\\circ\\): \\(D_{\\vec u}f=\\nabla f\\cdot\\vec u='+D.toFixed(2)+'\\) → <b>'+estado+'</b>. Máximo \\(4.47\\) cuando \\(\\vec u\\parallel\\nabla f\\) (\\(\\alpha\\approx 63.4^\\circ\\)); cero cuando \\(\\vec u\\) es tangente a la elipse de nivel.';
    typeset(readout);
  }
  requestAnimationFrame(draw); window.addEventListener('resize',()=>requestAnimationFrame(draw));
};

/* --- Módulo triples: el sólido esfera-cono en el semiplano (r,z) --- */
WIDGETS['esfera-cono']=function(host){
  whead(host,'El sólido estrella del examen','esfera x²+y²+z²=4z + cono z=√(x²+y²)');
  const {cv,ctx,size}=setupCanvas(host,320);
  const readout=el('div','readout'); host.appendChild(readout);
  const ctr=ctrlRow(host);
  let deg=25;
  ctr.appendChild(rangeField('φ (°)',0,45,25,1,v=>{deg=v;draw();}).f);
  function draw(){
    const {w,h}=size(); ctx.clearRect(0,0,w,h);
    const s=Math.min((w-70)/4.6,(h-50)/4.4), ox=44, oy=h-28;
    const X=r=>ox+r*s, Y=z=>oy-z*s;
    // región del sólido (corte): línea z=r hasta (2,2), luego arco de la esfera hasta (0,4)
    ctx.fillStyle=cssVar('--accent'); ctx.globalAlpha=0.16;
    ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(2),Y(2));
    for(let i=0;i<=60;i++){ const p=i/60*Math.PI/2; ctx.lineTo(X(2*Math.cos(p)),Y(2+2*Math.sin(p))); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
    // ejes
    ctx.strokeStyle=cssVar('--border'); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(4.4),Y(0)); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(0),Y(4.3)); ctx.stroke();
    ctx.fillStyle=cssVar('--muted'); ctx.font='12px sans-serif';
    ctx.fillText('r', X(4.4)-10, Y(0)+16); ctx.fillText('z', X(0)-16, Y(4.3)+10);
    ctx.fillText('2', X(2)-3, Y(0)+16); ctx.fillText('4', X(0)-16, Y(4)+4); ctx.fillText('2', X(0)-16, Y(2)+4);
    // esfera ρ=4cosφ  ⇔  r²+(z−2)²=4  (semicircunferencia r≥0)
    ctx.strokeStyle=cssVar('--accent3'); ctx.lineWidth=2.2; ctx.beginPath();
    for(let i=0;i<=90;i++){ const p=-Math.PI/2+i/90*Math.PI; const rr=2*Math.cos(p), zz=2+2*Math.sin(p);
      (i?ctx.lineTo:ctx.moveTo).call(ctx,X(rr),Y(zz)); }
    ctx.stroke();
    // cono z=r  ⇔  φ=π/4
    ctx.strokeStyle=cssVar('--accent2'); ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(2.7),Y(2.7)); ctx.stroke();
    ctx.fillStyle=cssVar('--accent3'); ctx.fillText('ρ = 4cos φ', X(1.7), Y(3.9));
    ctx.fillStyle=cssVar('--accent2'); ctx.fillText('φ = π/4 (cono)', X(2.15), Y(2.35));
    // rayo a ángulo φ desde el eje z, hasta ρ=4cosφ
    const phi=deg*Math.PI/180, rmax=4*Math.cos(phi);
    const ex=rmax*Math.sin(phi), ez=rmax*Math.cos(phi);
    ctx.strokeStyle=cssVar('--warn'); ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(ex),Y(ez)); ctx.stroke();
    ctx.fillStyle=cssVar('--warn'); ctx.beginPath(); ctx.arc(X(ex),Y(ez),4.5,0,7); ctx.fill();
    readout.innerHTML='Corte en el semiplano \\((r,z)\\). Con \\(\\varphi='+deg+'^\\circ\\), el rayo entra al sólido y sale en la esfera: \\(\\rho\\) recorre \\([0,\\ 4\\cos\\varphi]\\), aquí \\(\\rho_{\\max}='+rmax.toFixed(2)+'\\). Límites completos: \\(0\\le\\theta\\le 2\\pi\\), \\(0\\le\\varphi\\le\\pi/4\\), \\(0\\le\\rho\\le 4\\cos\\varphi\\) → \\(V=8\\pi\\).';
    typeset(readout);
  }
  requestAnimationFrame(draw); window.addEventListener('resize',()=>requestAnimationFrame(draw));
};
